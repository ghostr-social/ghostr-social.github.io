name: Sync stable Android release

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stable-android-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out update site
        uses: actions/checkout@v5

      - name: Download latest complete release metadata
        run: |
          curl --fail --location --retry 3 \
            --output candidate.json \
            https://github.com/ghostr-social/app/releases/latest/download/stable.json

      - name: Validate release contract and monotonic version
        run: |
          test "$(wc -c < candidate.json)" -le 65536
          jq -e '
            . as $release |
            (keys | sort) == [
              "artifacts", "channel", "namespace", "packageName",
              "publishedAt", "releaseUrl", "schemaVersion", "versionCode",
              "versionName"
            ] and
            .schemaVersion == 1 and
            .namespace == "ghostr.social" and
            .packageName == "app.ghostr" and
            .channel == "stable" and
            (.versionName | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.versionCode | type == "number" and . > 0 and floor == .) and
            (.publishedAt |
              test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")
            ) and
            .releaseUrl == (
              "https://github.com/ghostr-social/app/releases/tag/v" +
              $release.versionName
            ) and
            (.artifacts | type == "array" and length == 3) and
            ([.artifacts[].abi] | sort) ==
              ["arm64-v8a", "armeabi-v7a", "x86_64"] and
            all(.artifacts[];
              (keys | sort) == ["abi", "sha256", "size", "url"] and
              (.size | type == "number" and . > 0 and . <= 536870912) and
              (.sha256 | test("^[0-9a-f]{64}$")) and
              .url == (
                "https://github.com/ghostr-social/app/releases/download/v" +
                $release.versionName + "/ghostr-v" +
                $release.versionName + "-" + .abi + ".apk"
              )
            )
          ' candidate.json >/dev/null
          current=$(jq -r '.versionCode // 0' stable.json 2>/dev/null || echo 0)
          candidate=$(jq -r '.versionCode' candidate.json)
          if ! cmp -s candidate.json stable.json; then
            test "$candidate" -gt "$current"
          fi

      - name: Publish changed metadata
        run: |
          if cmp -s candidate.json stable.json; then exit 0; fi
          mv candidate.json stable.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable.json
          git commit -m "Publish Ghostr v$(jq -r .versionName stable.json)"
          git push origin main

      - name: Prepare update site
        run: |
          mkdir _site
          cp stable.json _site/stable.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload update site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy update site
        id: deployment
        uses: actions/deploy-pages@v4
